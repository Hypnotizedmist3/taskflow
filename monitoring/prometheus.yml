global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["taskflow-alertmanager:9093"]

scrape_configs:
  - job_name: taskflow-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://taskflow-backend-staging:3000/health
          - http://taskflow-backend-production:3000/health
          - http://taskflow-frontend-staging:80/health
          - http://taskflow-frontend-production:80/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: taskflow-blackbox:9115
